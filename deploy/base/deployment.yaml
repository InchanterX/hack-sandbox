apiVersion: apps/v1
kind: Deployment
metadata:
  name: smoke-api
spec:
  replicas: 1
  progressDeadlineSeconds: 60
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: smoke-api
  template:
    metadata:
      labels:
        app: smoke-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
      - name: api
        image: api
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /smoke-intentionally-missing
            port: http
          periodSeconds: 2
          timeoutSeconds: 1
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
