apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: calc-queue
spec:
  parentRefs:
    - name: home-gateway
      namespace: default
  hostnames:
    - sandbox.hack.faberge-eggs.ru
  rules:
    - matches:
        - path: {type: PathPrefix, value: /api}
      backendRefs:
        - name: server
          port: 8080
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: web
          port: 8080
