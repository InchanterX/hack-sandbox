# yaml-language-server: $schema=https://github.com/InchanterX/the-silent-orchestra/contracts/schemas/images-file.schema.json
# Images the Conductor builds in-cluster (BuildKit) on every release and pushes to
# <registry>/hack-<project>/<name>:<sha>. Owned by scaffold (S4); list it in shared_files.
# dockerfile is relative to context.
version: 1
images:
  - name: server
    context: server
    dockerfile: Dockerfile
  - name: web
    context: web
    dockerfile: Dockerfile
