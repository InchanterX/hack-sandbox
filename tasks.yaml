# yaml-language-server: $schema=https://github.com/InchanterX/the-silent-orchestra/contracts/schemas/tasks-file.schema.json
# S3: sequential Must DAG from PLAN.md. S6 writes API e2e after T07; S7 releases.
version: 1
project_id: sandbox

shared_files:
  - contracts/**
  - server/go.mod
  - server/go.sum
  - server/.golangci.yml
  - server/internal/openapi/**
  - server/internal/server/**
  - server/internal/httpjson/**
  - server/internal/testdb/**
  - server/migrations/**
  - web/package.json
  - web/package-lock.json
  - web/index.html
  - web/vite.config.ts
  - web/vitest.config.ts
  - web/tsconfig*.json
  - web/eslint.config.js
  - web/src/main.tsx
  - web/src/router.tsx
  - web/src/api/schema.d.ts
  - web/src/test/**
  - tests/contract/**
  - tests/e2e/package.json
  - tests/e2e/package-lock.json
  - compose.yaml
  - Dockerfile.dev
  - deploy/images.yaml
  - deploy/secrets.yaml
  - .github/**
  - .gitignore
  - .env.example
  - README.md

defaults:
  max_attempts: 3
  check_env: {kind: compose, file: compose.yaml, service: dev}
  checks:
    - {name: contract-install, cmd: 'npm --prefix tests/contract ci'}
    - {name: contract, cmd: 'npm --prefix tests/contract test'}
  stack_checks:
    backend:
      - {name: backend-lint, cmd: 'cd server && golangci-lint run ./...'}
      - {name: backend-build, cmd: 'cd server && go build ./...'}
      - {name: backend-unit-integration, cmd: 'cd server && go test -race -tags=integration ./...'}
    frontend:
      - {name: frontend-install, cmd: 'cd web && npm ci'}
      - {name: frontend-lint, cmd: 'cd web && npm run lint'}
      - {name: frontend-types, cmd: 'cd web && npm run typecheck'}
      - {name: frontend-unit, cmd: 'cd web && npm test -- --run'}
      - {name: frontend-build, cmd: 'cd web && npm run build'}
    devops:
      - {name: deploy-render, cmd: 'kustomize build deploy/overlays/demo > /dev/null'}
      - {name: dockerfile-lint, cmd: 'hadolint server/Dockerfile web/Dockerfile Dockerfile.dev'}
  e2e: {name: e2e, cmd: 'npm --prefix tests/e2e test'}

tasks:
  - id: T01
    title: Scaffold, embedded schema, contract tooling, compose and deployment skeleton
    stage: S4
    mode: solo
    tier: T1
    owned_files: ['**']
    acceptance_criteria:
      - 'The generated Go and TS bindings are committed; npm --prefix tests/contract test validates all ten OpenAPI operations, types.ts, examples.json, migration DDL parity and regeneration without a diff.'
      - 'All module constructors/exports in contracts/module-interfaces.md compile; the shared route table registers the ten API operations, and the React router resolves /login, /register and protected /.'
      - 'Go integration tests apply embedded goose migrations twice in an isolated Postgres schema, observe users/sessions/tasks and both required task indexes, and reject invalid task-state rows.'
      - 'Health handler tests observe 200 with status ok for a reachable DB and 503 with the Russian unavailable envelope for a failed ping; config tests cover defaults, invalid values and password URL escaping.'
      - 'With POSTGRES_PASSWORD and the dev DATABASE_URL supplied through environment, docker compose up starts db, server, web and dev; db healthcheck succeeds and GET /api/healthz returns 200 after migrations.'
      - 'CI invokes the defaults checks and every stack area in compose service dev; backend build/race tests, frontend checks, Kustomize render and Dockerfile lint pass on the skeleton without Docker inside dev.'
      - 'deploy/images.yaml has exactly server and web build entries with name/context/dockerfile; deploy/secrets.yaml declares only db/POSTGRES_PASSWORD; rendered demo resources use hack-sandbox, named images, secretKeyRef and the required HTTPRoute.'
      - 'tests/e2e/package.json and its committed lockfile provide the Node 24 TypeScript node --test command used by defaults.e2e; the full scenario is explicitly assigned to S6 and no passing stub claims demo completion.'
    estimate_min: 80
    context_refs:
      - SPEC.md#Scaffold
      - SPEC.md#Shared-files
      - SPEC.md#Verification
      - contracts/README.md
      - contracts/openapi.yaml
      - contracts/schema.sql
      - contracts/types.ts
      - contracts/module-interfaces.md
      - brief/04_stack/00_overview.md
      - brief/04_stack/backend.md
      - brief/04_stack/frontend.md
      - brief/04_stack/devops.md
      - brief/05_conventions.md
      - brief/08_deploy.md
      - PLAN.md
    stack: [backend, frontend, devops]

  - id: T02
    title: Arithmetic parser and cancellable evaluator
    stage: S5
    mode: solo
    tier: T2
    depends_on: [T01]
    owned_files: ['server/internal/calc/**']
    acceptance_criteria:
      - 'Table-driven calc tests produce every success result in contracts/examples.json, including 11/2/93, left associativity, unary minus, decimals, leading zeros, ten-place rounding and positive zero.'
      - 'Every syntax_error fixture matches ErrSyntax; .5, 5., exponent notation, unary plus, forbidden characters, unbalanced parentheses and trailing tokens are rejected by Parse.'
      - 'Parse accepts division-by-zero grammar and the calculator-only overflow fixtures; Eval matches ErrDivisionByZero or ErrOverflow as appropriate, without returning nonfinite results.'
      - 'Callback tests observe one callback per executed binary operation and none for parentheses/literals/unary minus; cancellation stops evaluation with context error and race/goleak checks pass.'
    estimate_min: 35
    context_refs:
      - SPEC.md#Calculator
      - contracts/module-interfaces.md#Calculator
      - contracts/examples.json
      - brief/04_stack/backend.md
      - DECISIONS.md
    stack: [backend]

  - id: T03
    title: Registration, opaque sessions and Bearer authentication
    stage: S5
    mode: solo
    tier: T2
    depends_on: [T02]
    owned_files: ['server/internal/auth/**']
    acceptance_criteria:
      - 'Handler/store tests observe register 201 with token/expires_at/User, duplicate login 409 login_taken (including concurrent attempts), valid login 200 and wrong credentials 401 invalid_credentials.'
      - 'Validation tests reject invalid login characters/length and passwords outside 8–72 UTF-8 bytes with 422 validation_error; four Cyrillic letters are accepted and 37 are rejected.'
      - 'Database assertions find bcrypt password hashes and only a 32-byte SHA-256 session key; returned raw tokens decode to 32 random bytes, and session expiry equals configured TTL.'
      - 'Middleware/handler tests observe /api/me 200 for a valid token and 401 unauthorized for absent, invalid, expired or logged-out tokens; logout returns 204 without a body and revokes only its own session.'
      - 'HTTP error tests assert Russian messages and the OpenAPI envelope; auth.UserFromContext returns the authenticated user through a typed private context key.'
    estimate_min: 45
    context_refs:
      - SPEC.md#Auth
      - contracts/openapi.yaml
      - contracts/schema.sql
      - contracts/module-interfaces.md#Backend-composition
      - brief/04_stack/backend.md
      - DECISIONS.md
    stack: [backend]

  - id: T04
    title: User-owned task CRUD with transactional status rules
    stage: S5
    mode: solo
    tier: T2
    depends_on: [T03]
    owned_files: ['server/internal/tasks/**']
    acceptance_criteria:
      - 'Handler/store tests create a queued task with null execution fields (201), list only own tasks newest first with items [] when empty, and read an own task (200) using the OpenAPI wire shape.'
      - 'GET/PATCH/DELETE tests return 404 not_found for another user’s task, a missing UUID and malformed UUID; unauthenticated task requests return 401 before resource lookup.'
      - 'POST and queued PATCH tests return 422 validation_error for lengths 0/201 and 422 syntax_error for forbidden characters or invalid grammar; failed requests leave row count and stored expressions unchanged.'
      - 'PATCH of queued succeeds with 200 and preserves id/created_at; every other state yields 409 not_queued. DELETE of running yields 409 task_running; queued/done/failed delete with empty 204 responses.'
      - 'Postgres lock-order tests exercise mutation versus an atomic claim: accepted PATCH is the expression returned by later claim; claim-first PATCH/DELETE returns 409; delete-first claim cannot take the deleted row.'
    estimate_min: 45
    context_refs:
      - SPEC.md#Tasks
      - contracts/openapi.yaml
      - contracts/schema.sql
      - contracts/module-interfaces.md#Queue-and-user-mutation-serialization
      - brief/04_stack/backend.md
      - DECISIONS.md
    stack: [backend]

  - id: T05
    title: Worker pool, recovery and server lifecycle composition
    stage: S5
    mode: solo
    tier: T1
    depends_on: [T04]
    owned_files:
      - server/internal/queue/**
      - server/cmd/server/main.go
    acceptance_criteria:
      - 'Postgres tests with two workers claim distinct queued tasks in created_at/id order using SKIP LOCKED, return the current expression, and release row locks before evaluator delays.'
      - 'Worker tests observe queued/running/done or failed with the required timestamps and result/error fields; demo expressions finish with 11/2/93 and division_by_zero retains the exact Russian message.'
      - 'Managed-time tests verify WORKERS=2, one OP_DELAY_MS delay per executed binary operation, POLL_INTERVAL_MS idle retry, cancellation of timers and bounded retries after transient store errors; race and goleak checks pass.'
      - 'Recovery integration tests turn seeded running rows into queued with all execution fields null before workers start, then complete them; queued and terminal rows retain their state.'
      - 'Lifecycle tests observe no new claims after stop, completion of active work within the 10-second grace, cancellation after that deadline, and interrupted rows remaining recoverable instead of being marked failed.'
      - 'The composed server connects within the configured 60-second startup budget, applies migrations then recovery before serving, answers the ten real routes, and exits on SIGTERM within the 30-second pod grace.'
    estimate_min: 55
    context_refs:
      - SPEC.md#Queue
      - SPEC.md#Runtime
      - contracts/module-interfaces.md
      - contracts/schema.sql
      - contracts/examples.json
      - brief/04_stack/backend.md
      - PLAN.md
    stack: [backend]

  - id: T06
    title: Russian auth and task screens with polling and account isolation
    stage: S5
    mode: solo
    tier: T2
    depends_on: [T05]
    owned_files:
      - web/src/api/client.ts
      - web/src/auth/**
      - web/src/screens/**
      - web/src/components/**
      - web/src/hooks/**
      - web/src/styles/**
    acceptance_criteria:
      - 'Testing Library tests submit login/register, validate password bytes with TextEncoder, display Russian 401/409/422 form errors, and navigate successful sessions to /; guests on protected routes reach /login.'
      - 'Session/client tests persist the token in localStorage, validate bootstrap through /api/me, and on protected 401/logout/account change cancel requests and clear old user cache; delayed old responses never appear for a new account.'
      - 'Task screen tests render loading, the exact empty hint, a network error with Повторить, and success including numeric result 0 and failed error.message; all requests use the typed singleton client.'
      - 'Controlled-time query tests observe a 1000 ms refetch interval with a user-specific key and mutation invalidation; create/edit/delete tests show inline 422/409 errors and update the list without page reload.'
      - 'Rendered queued items expose Изменить and Удалить, running items expose neither, terminal items expose only Удалить; inline editing offers Сохранить/Отмена and preserves input on errors.'
      - 'At 360/640 px tasks render as cards and at 1280 px as a table inside a max-720 px column without overflow; CSS uses the specified tokens, mono expressions/results, four Russian status labels and an animated running indicator respecting reduced motion.'
      - 'Keyboard checks reach labeled inputs, submit/cancel/retry/logout controls and visible focus; live status/error announcements do not replace input or move focus during polling.'
    estimate_min: 80
    context_refs:
      - SPEC.md#Frontend
      - SPEC.md#Design
      - contracts/openapi.yaml
      - contracts/types.ts
      - contracts/module-interfaces.md#Frontend-composition
      - brief/04_stack/frontend.md
      - brief/07_design.md
      - DECISIONS.md
    stack: [frontend]

  - id: T07
    title: Production images and demo Kustomize deployment
    stage: S5
    mode: solo
    tier: T2
    depends_on: [T06]
    owned_files:
      - server/Dockerfile
      - web/Dockerfile
      - web/nginx.conf
      - deploy/base/**
      - deploy/overlays/demo/**
    acceptance_criteria:
      - 'Dockerfiles build server with golang:1.26 into distroless nonroot /server and web with Node 24 into nginx-unprivileged:1.29-alpine on 8080; hadolint passes and nginx serves SPA deep links without an API proxy.'
      - 'kustomize build deploy/overlays/demo renders only allowed namespace-scoped objects in hack-sandbox; HTTPRoute host sandbox.hack.faberge-eggs.ru attaches to default/home-gateway and preserves /api to server:8080, with / to web:8080.'
      - 'Rendered resources have db StatefulSet one replica, local-path PVC 1Gi and Service; server/web Deployments and Services; server one replica with Recreate and terminationGracePeriodSeconds 30.'
      - 'Rendered manifests use server/web image names from the shared catalog, exact per-container requests/limits from brief/08_deploy.md, server readiness/liveness healthz (failureThreshold 6) and 60-second startup window, web HTTP probes and db pg_isready probes.'
      - 'Manifest contract checks find DB password only via secretKeyRef db/POSTGRES_PASSWORD on server and db, correct ConfigMap defaults, and no Secret values, forbidden objects, latest tags, privileged mode, hostPath, NodePort/LoadBalancer or imagePullPolicy Always.'
    estimate_min: 45
    context_refs:
      - SPEC.md#Deploy
      - SPEC.md#Verification
      - brief/04_stack/devops.md
      - brief/08_deploy.md
      - PLAN.md
    stack: [devops]
