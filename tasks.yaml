# yaml-language-server: $schema=https://github.com/InchanterX/the-silent-orchestra/contracts/schemas/tasks-file.schema.json
# S3 backlog round 1: only new tasks; completed T01/T02 remain in history.
# No S4: the existing scaffold is reused; T01 is a completed external dependency.
# Validate with `orchestra validate-tasks tasks.yaml` in the Conductor environment.
# Patterns are gitignore-style globs anchored at the repository root.
version: 1
project_id: sandbox-repair

shared_files:
  - app/Dockerfile
  - .dockerignore
  - compose.yaml
  - deploy/images.yaml
  - deploy/base/deployment.yaml
  - deploy/base/service.yaml
  - deploy/base/kustomization.yaml
  - deploy/overlays/demo/kustomization.yaml
  - tests/contract/**
  - docs/scaffold-smoke.md

defaults:
  max_attempts: 3
  check_env: {kind: compose, file: compose.yaml, service: dev}
  checks:
    - {name: contract, cmd: 'python -m unittest discover -s tests/contract -v'}
  e2e: {name: e2e, cmd: 'python -m unittest discover -s tests/e2e -v'}
  # The sole backend area is covered by the common contract command.
  stack_checks:
    backend: []

tasks:
  - id: T03
    title: Document the repeat release smoke for readiness recovery
    stage: S5
    mode: solo
    tier: T3
    depends_on: [T01]
    owned_files: [docs/smoke/repair-round.md]
    acceptance_criteria:
      - >-
        The operator can read a short docs/smoke/repair-round.md describing
        readiness recovery verification for smoke-api in hack-sandbox-repair,
        from the initial Ready state through an observed NotReady state to
        restored Ready/Available, Argo Healthy and the expected release SHA.
      - >-
        The instructions assign intentional readiness fault injection and
        recovery to the S7 operator; S5 delivers only the new document and
        preserves application behaviour, Dockerfile, Kubernetes manifests,
        existing checks and historical smoke reports.
      - >-
        The recovery instructions include port-forward verification of
        GET /healthz returning 200 with exactly {"status":"ok"}, GET /
        returning 200 with exactly {"message":"sandbox-repair smoke"}, and
        GET /not-a-route returning 404 with exactly {"error":"not_found"};
        every response has Content-Type application/json.
      - >-
        The document requests fresh evidence before injection, while NotReady
        and after recovery, and identifies unavailable infrastructure as an
        unpassed release gate rather than claiming a successful recovery.
    context_refs:
      - BACKLOG.md#раунд-1
      - SPEC.md#раунд-1-восстановление-readiness
      - SPEC.md#контракты
      - contracts/openapi.yaml
      - brief/08_deploy.md
    stack: [backend]
    estimate_min: 5
